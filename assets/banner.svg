<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E10098" />
      <stop offset="50%" stop-color="#9333EA" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="node-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E10098" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3B82F6" stop-opacity="0.8" />
    </linearGradient>
    
    <!-- Glow Filters -->
    <filter id="glow-pink" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glow-blue" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="25" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" fill="url(#bg-grad)" rx="16" />

  <!-- Dynamic Glowing Background Blobs (Low Opacity in Background) -->
  <g opacity="0.25">
    <circle cx="150" cy="80" r="180" fill="#E10098" filter="url(#glow-pink)">
      <animate attributeName="cx" values="150;220;150" dur="10s" repeatCount="indefinite" />
      <animate attributeName="cy" values="80;130;80" dur="8s" repeatCount="indefinite" />
    </circle>
    <circle cx="1050" cy="280" r="200" fill="#3B82F6" filter="url(#glow-blue)">
      <animate attributeName="cx" values="1050;980;1050" dur="12s" repeatCount="indefinite" />
      <animate attributeName="cy" values="280;220;280" dur="9s" repeatCount="indefinite" />
    </circle>
    <circle cx="900" cy="70" r="120" fill="#9333EA" filter="url(#glow-pink)">
      <animate attributeName="r" values="120;160;120" dur="7s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Animated Dynamic Data Nodes & GraphQL Network Connections (Behind Text) -->
  <g opacity="0.35" stroke="#9333EA" stroke-width="1.5" stroke-dasharray="4 4">
    <!-- Connecting lines -->
    <line x1="100" y1="280" x2="300" y2="320">
      <animate attributeName="stroke-dashoffset" values="0;20" dur="2s" repeatCount="indefinite" />
    </line>
    <line x1="300" y1="320" x2="500" y2="290" />
    <line x1="900" y1="300" x2="1100" y2="260">
      <animate attributeName="stroke-dashoffset" values="20;0" dur="3s" repeatCount="indefinite" />
    </line>
    <line x1="1050" y1="80" x2="1150" y2="180" />
  </g>

  <!-- Dynamic Pulse Rings (Background Visual Interest) -->
  <g opacity="0.4">
    <circle cx="100" cy="280" r="8" fill="url(#node-grad)">
      <animate attributeName="r" values="4;14;4" dur="3s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="1100" cy="260" r="10" fill="url(#node-grad)">
      <animate attributeName="r" values="6;18;6" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="4s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Floating Dynamic Tech Pills (Kept at Top Right & Bottom Left away from center text) -->
  <g opacity="0.85">
    <!-- Real-Time WebSocket Pill -->
    <g transform="translate(920, 40)">
      <rect x="0" y="0" width="180" height="34" rx="17" fill="#1e293b" stroke="#E10098" stroke-width="1.5" />
      <circle cx="20" cy="17" r="5" fill="#10B981">
        <animate attributeName="opacity" values="1;0.2;1" dur="1.5s" repeatCount="indefinite" />
      </circle>
      <text x="35" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#F8FAFC">⚡ Real-Time Data</text>
    </g>

    <!-- Subscriptions & Federation Pill -->
    <g transform="translate(80, 40)">
      <rect x="0" y="0" width="200" height="34" rx="17" fill="#1e293b" stroke="#3B82F6" stroke-width="1.5" />
      <circle cx="20" cy="17" r="5" fill="#3B82F6">
        <animate attributeName="r" values="3;6;3" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="35" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#F8FAFC">🕸️ GraphQL Federation</text>
    </g>
  </g>

  <!-- FOREGROUND CONTENT - TITLE & SUBTITLE (Guaranteed High Contrast & Visibility) -->
  <g text-anchor="middle" transform="translate(600, 150)">
    <!-- GraphQL Icon / Logo SVG in Header -->
    <g transform="translate(-25, -65) scale(1.3)">
      <path d="M 18.2 2.2 Z M 32.8 10.6 L 32.8 27.4 L 18.2 35.8 L 3.6 27.4 L 3.6 10.6 L 18.2 2.2 Z" fill="none" stroke="#E10098" stroke-width="2.5" />
      <circle cx="18.2" cy="2.2" r="3" fill="#E10098" />
      <circle cx="32.8" cy="10.6" r="3" fill="#E10098" />
      <circle cx="32.8" cy="27.4" r="3" fill="#E10098" />
      <circle cx="18.2" cy="35.8" r="3" fill="#E10098" />
      <circle cx="3.6" cy="27.4" r="3" fill="#E10098" />
      <circle cx="3.6" cy="10.6" r="3" fill="#E10098" />
    </g>

    <!-- Main Title -->
    <text y="30" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" letter-spacing="-0.5" fill="#FFFFFF">
      Awesome Managed GraphQL &amp; Real-Time Data API
    </text>

    <!-- Gradient Highlight Sub-Bar / Category -->
    <text y="75" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="url(#text-grad)" letter-spacing="0.5">
      SAAS PLATFORMS • REAL-TIME SUBSCRIPTIONS • FEDERATION • OPEN-SOURCE ENGINES
    </text>

    <!-- Subtitle / Tagline -->
    <text y="115" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#94A3B8" letter-spacing="0.2">
      Curated Landscape Analysis, Pricing Benchmarks, Enterprise Valuations &amp; Star Rankings (2026)
    </text>
  </g>
</svg>
